    <text style="font-weight: 700; font-size: 8.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #213547" x="1.44" y="11.588273" transform="rotate(-0 1.44 11.588273)">ANALYSIS AND VALIDATION WORKFLOW</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #28618a" x="7.56" y="31.596094" transform="rotate(-0 7.56 31.596094)">1  Build exact sets</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #213547" transform="translate(7.56 40.486375)">Reverse edges; SCC / DAG</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #213547" transform="translate(7.56 49.666375)">Portfolio unions; deduplicate</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #28618a" x="137.16" y="30.869531" transform="rotate(-0 137.16 30.869531)">2  Fix comparisons</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #213547" transform="translate(137.16 41.145125)">5 baseline rules + 200 orders</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #213547" transform="translate(137.16 49.666375)">Budgets 1, 5, 10, 25, 50, 100</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #28618a" x="137.16" y="76.956094" transform="rotate(-0 137.16 76.956094)">3  Evaluate selection</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #213547" transform="translate(137.16 85.846375)">C: distinct endpoints</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #213547" transform="translate(137.16 95.026375)">H: pair mass; P: all sources</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #28618a" x="7.56" y="76.229531" transform="rotate(-0 7.56 76.229531)">4  Test assumptions</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #213547" transform="translate(7.56 85.846375)">Version continuity; mappings</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #213547" transform="translate(7.56 95.026375)">Depth, ties, identity grouping</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #28618a" x="7.56" y="122.316094" transform="rotate(-0 7.56 122.316094)">5  Check correctness</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #213547" transform="translate(7.56 131.865125)">BFS + incidence + hashes</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #213547" transform="translate(7.56 140.386375)">675 roots in 60 small graphs</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #28618a" x="137.16" y="121.589531" transform="rotate(-0 137.16 121.589531)">6  Report limits</text>
   </g>
